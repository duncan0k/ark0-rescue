[package]
name = "voleith"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
description = "VOLE-in-the-head rescue proofs, SPEC.md v0.2: verifier and prover for statement 0x01"
publish = false

[lib]
name = "voleith"
# rlib for Rust users and tests; staticlib for linking into Bitcoin Core.
crate-type = ["rlib", "staticlib"]

[features]
default = ["prover"]
# The prover: `prove`, `ProveError`, the prover halves of the VOLE
# commitment and of the circuit, and the dudect timing tests. Without it
# (`--no-default-features`) the library is the verifier and the C ABI only,
# for linking into Bitcoin Core; see NOTES.md, "2026-10-23 tools and
# verifier-only build".
prover = []
# Exposes `voleith::bench`, which verifies and proves under other tree splits.
# Only the benchmark uses it; verify() and the C ABI never do.
bench-splits = []
# Exposes `voleith::prove_traced`, which also returns the prover's
# intermediate values, secrets included. Only the tests enable it (through
# the dev-dependency below); never enable it in a build that proves with a
# real seed. It adds nothing without `prover`.
test-trace = []
# The command-line tools voleith-prove and voleith-verify (src/bin/). It adds
# the prover and getrandom, which only voleith-prove uses: the library never
# calls getrandom.
cli = ["prover", "dep:getrandom"]

[dependencies]
# SHAKE256 (FIPS 202); see NOTES.md. Its `zeroize` feature clears the Keccak
# state when a hasher or XOF reader is dropped.
sha3 = { version = "=0.10.9", default-features = false, features = ["zeroize"] }
# Clearing the prover's secrets (rust/CT-AUDIT.md). 1.8.2 rather than 1.9.x:
# over a year old, MSRV 1.60, inside sha3's `^1.6` range, and without the
# `optimization_barrier` code that 1.9.0 introduced and 1.9.1 had to fix.
# No default features: `alloc` only, no derive macro (no proc-macro deps).
zeroize = { version = "=1.8.2", default-features = false, features = ["alloc"] }
# OS randomness for rho in voleith-prove only (feature `cli`); see NOTES.md,
# "2026-10-23 tools and verifier-only build". 0.3.4 rather than 0.4.x: a year
# old, MSRV 1.63, and the version most of the ecosystem runs. No features.
getrandom = { version = "=0.3.4", default-features = false, optional = true }

[dev-dependencies]
# Reading the JSON test vectors.
serde_json = "=1.0.149"
# BIP-340 Schnorr baseline in the benchmark (bundled libsecp256k1).
secp256k1 = { version = "=0.31.1", default-features = false, features = ["std"] }
# The crate itself with `test-trace`, so that `cargo test` compares the
# prover's intermediates with the vector file. Features of dev-dependencies
# apply only when tests, benches or examples are built, never to the library
# alone. No default features, so that `cargo test --no-default-features`
# tests the verifier-only library.
voleith = { path = ".", default-features = false, features = ["test-trace"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "unwind"

# Tests verify 130.2 kB proofs: optimise them, keep debug assertions and
# overflow checks.
[profile.dev]
opt-level = 2

[profile.dev.package."*"]
opt-level = 3

[[bench]]
name = "verify"
harness = false
required-features = ["bench-splits", "prover"]

[[bench]]
name = "prove_verify"
harness = false
required-features = ["prover"]

# The command-line tools (feature `cli`); see README.md.
[[bin]]
name = "voleith-prove"
path = "src/bin/voleith-prove.rs"
required-features = ["cli"]

[[bin]]
name = "voleith-verify"
path = "src/bin/voleith-verify.rs"
required-features = ["cli"]

[[test]]
name = "cli"
required-features = ["cli"]
