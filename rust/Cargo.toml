[package]
name = "voleith"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
description = "VOLE-in-the-head rescue proofs, SPEC.md v0.2: verifier and prover for statement 0x01"
publish = false

[lib]
name = "voleith"
# rlib for Rust users and tests; staticlib for linking into Bitcoin Core.
crate-type = ["rlib", "staticlib"]

[features]
# Exposes `voleith::bench`, which verifies and proves under other tree splits.
# Only the benchmark uses it; verify() and the C ABI never do.
bench-splits = []
# Exposes `voleith::prove_traced`, which also returns the prover's
# intermediate values, secrets included. Only the tests enable it (through
# the dev-dependency below); never enable it in a build that proves with a
# real seed.
test-trace = []

[dependencies]
# SHAKE256 (FIPS 202). The only runtime dependency; see NOTES.md.
sha3 = { version = "=0.10.9", default-features = false }

[dev-dependencies]
# Reading the JSON test vectors.
serde_json = "=1.0.149"
# BIP-340 Schnorr baseline in the benchmark (bundled libsecp256k1).
secp256k1 = { version = "=0.31.1", default-features = false, features = ["std"] }
# The crate itself with `test-trace`, so that `cargo test` compares the
# prover's intermediates with the vector file. Features of dev-dependencies
# apply only when tests, benches or examples are built, never to the library
# alone.
voleith = { path = ".", features = ["test-trace"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "unwind"

# Tests verify 130.2 kB proofs: optimise them, keep debug assertions and
# overflow checks.
[profile.dev]
opt-level = 2

[profile.dev.package."*"]
opt-level = 3

[[bench]]
name = "verify"
harness = false
required-features = ["bench-splits"]

[[bench]]
name = "prove_verify"
harness = false
